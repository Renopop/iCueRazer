<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Razer Battery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Segoe UI', Arial, sans-serif;
      width: 340px;
      padding: 16px;
      min-height: 180px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e1e1e;
    }

    .logo {
      font-size: 16px;
      font-weight: 700;
      color: #00ff41;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .logo sub {
      color: #555;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: none;
      margin-left: 4px;
    }

    .refresh-btn {
      background: none;
      border: 1px solid #2a2a2a;
      color: #555;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }
    .refresh-btn:hover { border-color: #00ff41; color: #00ff41; }
    .refresh-btn:active { transform: rotate(180deg); }
    .refresh-btn.spinning { animation: spin 0.6s linear; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #deviceList {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .device-card {
      background: #141414;
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .device-icon { font-size: 22px; flex-shrink: 0; }

    .device-info { flex: 1; min-width: 0; }

    .device-name {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .battery-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .battery-pct {
      font-size: 24px;
      font-weight: 700;
      min-width: 56px;
      line-height: 1;
    }
    .battery-pct.green  { color: #00ff41; }
    .battery-pct.yellow { color: #ffaa00; }
    .battery-pct.red    { color: #ff3333; }

    .bar-wrap {
      flex: 1;
      height: 5px;
      background: #0d0d0d;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s ease;
    }
    .bar.green  { background: #00ff41; }
    .bar.yellow { background: #ffaa00; }
    .bar.red    { background: #ff3333; }

    .charging-icon {
      font-size: 15px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .no-battery {
      font-size: 11px;
      color: #444;
      font-style: italic;
    }

    .loading-dots::after {
      content: '…';
      animation: dots 1.2s steps(3, end) infinite;
    }
    @keyframes dots {
      0%   { content: '.'; }
      33%  { content: '..'; }
      66%  { content: '…'; }
    }

    .empty-state {
      text-align: center;
      padding: 28px 12px;
      color: #444;
      font-size: 13px;
      line-height: 1.7;
    }
    .empty-state .snake { font-size: 36px; display: block; margin-bottom: 10px; }

    .add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 11px;
      margin-top: 10px;
      background: none;
      border: 1px dashed #252525;
      border-radius: 8px;
      color: #444;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }
    .add-btn:hover { border-color: #00ff41; color: #00ff41; }

    .error-box {
      background: #160a0a;
      border: 1px solid #3a1010;
      border-radius: 8px;
      padding: 12px;
      color: #e05555;
      font-size: 12px;
      text-align: center;
      line-height: 1.6;
    }

    .footer {
      margin-top: 10px;
      text-align: right;
      font-size: 10px;
      color: #2a2a2a;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">RAZER<sub>battery</sub></div>
    <button class="refresh-btn" id="refreshBtn" title="Rafraîchir">↻</button>
  </div>

  <div id="deviceList"></div>
  <button class="add-btn" id="addBtn">+ Associer un appareil Razer</button>
  <div class="footer" id="footer"></div>

  <script src="popup.js"></script>
</body>
</html>
